<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Transactions</h2>
    <a class="btn btn-primary" routerLink="/transactions/new">+ New Transaction</a>
  </div>

  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
  <div *ngIf="loading">Loading...</div>

  <table class="table table-striped" *ngIf="!loading && transactions.length">
    <thead>
      <tr>
        <th>Date</th>
        <th>Part #</th>
        <th>Type</th>
        <th>Quantity</th>
        <th>Reference</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of transactions">
        <td>{{ t.transactionDate | date: 'short' }}</td>
        <td>{{ t.partNumber }}</td>
        <td>
          <span class="badge" [class.bg-success]="t.type === 'Inbound'" [class.bg-danger]="t.type === 'Outbound'" [class.bg-secondary]="t.type === 'Adjustment'">
            {{ t.type }}
          </span>
        </td>
        <td>{{ t.quantity }}</td>
        <td>{{ t.reference }}</td>
        <td>{{ t.notes }}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!loading && !transactions.length">No transactions found.</p>
</div>
